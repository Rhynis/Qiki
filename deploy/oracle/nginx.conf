# nginx reverse proxy for the Gasbot backend on a VPS (Oracle Cloud).
# Place at /etc/nginx/sites-available/gasbot, symlink into sites-enabled, then run certbot:
#   sudo ln -s /etc/nginx/sites-available/gasbot /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.YOUR-DOMAIN   (certbot fills in the SSL lines below)
# Replace api.YOUR-DOMAIN with your real hostname. Without a domain you can proxy on plain
# HTTP for testing, but Vercel BACKEND_URL should be HTTPS in production.

server {
    listen 80;
    server_name api.YOUR-DOMAIN;

    # certbot will add the listen 443 ssl block + certificate lines here.

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

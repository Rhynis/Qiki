version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gasbot-postgres
    environment:
      POSTGRES_DB: gasbot_dev
      POSTGRES_USER: gasbot
      POSTGRES_PASSWORD: gasbot_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gasbot -d gasbot_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gasbot-network

  redis:
    image: redis:7-alpine
    container_name: gasbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gasbot-network

  # Self-hosted vLLM OpenAI-compatible serving endpoint. NOT started by a plain
  # `docker compose up` — it needs a CUDA GPU host and is a benchmark/demo
  # layer (see docs/adr/0003-self-host-vllm-awq-serving.md), not a prod swap
  # (Railway has no GPU). Start explicitly with:
  #   docker compose --profile serving up vllm
  vllm:
    image: vllm/vllm-openai:latest
    container_name: gasbot-vllm
    profiles: ["serving"]
    # Requires an AWQ-quantized checkpoint (see the ADR for AWQ-INT4 vs GPTQ).
    # Swap VLLM_MODEL to a local path (mounted below) once you've quantized one.
    command: >-
      --model ${VLLM_MODEL:-Qwen/Qwen3-4B-Instruct-AWQ}
      --quantization awq
      --host 0.0.0.0
      --port 8000
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - vllm_model_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - gasbot-network

volumes:
  postgres_data:
  redis_data:
  vllm_model_cache:

networks:
  gasbot-network:
    driver: bridge

# Render Blueprint for the Gasbot backend (free plan, Docker).
# Shares ONE Upstash Redis + ONE Supabase Postgres with the other hosts (Railway/Oracle).
# Secrets are `sync: false` — set them in the Render dashboard; copy the SAME values used on
# the other hosts. JWT_SECRET_KEY MUST be identical across all hosts (HS256 tokens), or
# switching BACKEND_URL between hosts logs everyone out. See docs/HOSTING.md.
services:
  - type: web
    name: gasbot-backend
    runtime: docker
    repo: https://github.com/Rhynis/Gas-Rag-bot
    branch: main
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Non-secret defaults (blueprint-managed; keep identical to the other hosts).
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: gemini
      # Railway/Render block outbound SMTP -> use the Gmail API (HTTPS) for transactional email.
      - key: EMAIL_PROVIDER
        value: gmail_api
      # Generation runs on Vertex AI (the AI Studio key is depleted); match Railway's model.
      - key: GEMINI_USE_VERTEX
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: GOOGLE_CLOUD_LOCATION
        value: us-central1
      - key: EMBEDDING_PROVIDER
        value: gemini
      # Shared infra + secrets — set in the dashboard, IDENTICAL to the other hosts (copy from
      # Railway). JWT_SECRET_KEY / DATABASE_URL / REDIS_URL especially MUST match (docs/HOSTING.md),
      # or switching BACKEND_URL between hosts logs everyone out / points at a different DB.
      - key: DATABASE_URL # Supabase pooler URL (postgresql+asyncpg://...)
        sync: false
      - key: REDIS_URL # Upstash rediss://... (TLS)
        sync: false
      - key: JWT_SECRET_KEY # MUST match every host
        sync: false
      - key: FRONTEND_URL # https://gas-rag-bot-rhynis-projects.vercel.app
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLOUD_PROJECT # GCP project for Vertex
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON # Vertex service-account JSON (single-line)
        sync: false
      - key: GROQ_API_KEY # fallback LLM
        sync: false
      - key: JINA_API_KEY # fallback embeddings
        sync: false
      - key: GMAIL_CLIENT_ID # Gmail API OAuth (transactional email)
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

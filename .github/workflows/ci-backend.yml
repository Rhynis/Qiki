name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: scripts/secret-scan.sh --tracked

  test:
    needs: secret-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gasbot
          POSTGRES_PASSWORD: gasbot_test
          POSTGRES_DB: gasbot_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["6379:6379"]

    env:
      DATABASE_URL: postgresql+asyncpg://gasbot:gasbot_test@localhost:5432/gasbot_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: test_secret_key_at_least_32_characters_long_for_testing
      ENVIRONMENT: development
      # Keep the DeepEval eval suite (tests/eval) offline + deterministic in CI.
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      # Enables the optional intent-eval step below. Empty unless the repo secret is set,
      # in which case the step is skipped (the embedding-based classifier needs Gemini).
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app/
      - run: alembic upgrade head
      - run: pytest --cov --cov-fail-under=70
      - run: pytest tests/eval -v
      - run: python -m scripts.run_evaluation --suite safety
      # Optional 96-case intent suite. Runs only when the GEMINI_API_KEY secret is set
      # (the hybrid classifier embeds queries via Gemini). Report-only: it never blocks a
      # merge, since intent accuracy depends on non-deterministic LLM fallbacks.
      - name: Intent evaluation (optional — needs GEMINI_API_KEY secret)
        if: ${{ env.GEMINI_API_KEY != '' }}
        continue-on-error: true
        run: python -m scripts.run_evaluation --suite intent
      # GHSA-8rrh-rw8j-w5fx: dev/build-only `wheel` (deepeval transitive, not in the
      # runtime image); the fix needs packaging>=24 which runtime langfuse pins out.
      # PYSEC-2026-597: nltk 3.9.4 (transitive via underthesea, our VI tokenizer);
      # 3.9.4 is the latest release and the advisory has no fix version yet. Revisit
      # once upstream ships a patched nltk.
      # PYSEC-2026-1325: ecdsa (transitive); no fix version published yet.
      # PYSEC-2026-1805: protobuf 4.25.x pinned by the google-generativeai/grpc stack;
      # the fix (protobuf>=5.29.6) is a major bump those libraries do not yet allow.
      - run: >-
          pip-audit --strict
          --ignore-vuln GHSA-8rrh-rw8j-w5fx --ignore-vuln PYSEC-2026-597
          --ignore-vuln PYSEC-2026-1325 --ignore-vuln PYSEC-2026-1805

name: DB Backup

# Daily encrypted Postgres backup to S3-compatible storage, independent of Supabase's
# short built-in retention. Logic lives in scripts/backup_db.sh so it stays testable.

on:
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC = 03:00 Asia/Ho_Chi_Minh
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # failure notification via gh issue

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pg_dump client major version MUST be >= the Supabase server major version, or the
      # dump is refused. Pin postgresql-client-17 from the PGDG apt repo.
      - name: Install postgresql-client-17
        run: |
          set -euo pipefail
          # Install the PGDG signing key as an ASCII-armored .asc referenced via signed-by.
          # apt supports armored keys directly, avoiding `gpg --dearmor`, which fails in CI
          # ("gpg: cannot open '/dev/tty'") when run under sudo without a controlling terminal.
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          # aws (AWS CLI v2) and gpg are pre-installed on the GitHub ubuntu runner; the apt
          # `awscli` package was dropped on Ubuntu 24.04 (noble). Only pg_dump 17 is needed.
          sudo apt-get install -y postgresql-client-17
          aws --version
          gpg --version | head -1

      - name: Run encrypted backup
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: bash scripts/backup_db.sh

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="[ops-backup]"
          body="Daily DB backup failed at $(date -u +%FT%TZ). Run: $RUN_URL"
          existing="$(gh issue list --repo "$REPO" --state open \
            --search "$marker in:title" --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$marker daily backup failing" --body "$body"
          fi
